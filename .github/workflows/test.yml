name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        # actions/setup-python@v6
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python smoke tests
        run: python -m pytest tests -q

      - name: Run Blueprint offline evaluations
        run: python -m blueprint eval

  web-build:
    # 网页界面的构建产物提交在 blueprint/web/static/，使用者不需要 Node。
    # 这里重新构建一次，确认提交的产物和 web/ 源码一致（改了源码忘了构建会失败）。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # actions/checkout@v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node
        # actions/setup-node@v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Committed build is up to date
        run: git diff --exit-code -- ../blueprint/web/static || (echo "blueprint/web/static 与 web/ 源码不一致：在 web/ 里运行 npm run build 后提交" && exit 1)
